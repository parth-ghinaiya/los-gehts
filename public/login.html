<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in — Los geht's</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Crect width='3' height='1' fill='%23111'/%3E%3Crect y='1' width='3' height='1' fill='%23d7263d'/%3E%3Crect y='2' width='3' height='1' fill='%23f2b705'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="flag" aria-hidden="true"></div>

<main>
  <form id="form" class="card" novalidate>
    <h1>Los geht’s!</h1>
    <p class="lede">Sign in to continue.</p>

    <!-- Lets password managers file the passphrase under a name. -->
    <input type="text" name="username" autocomplete="username" value="los-gehts" hidden>

    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" name="password" autocomplete="current-password" required autofocus>

    <p id="message" class="message" role="alert" aria-live="polite"></p>

    <button type="submit" id="submit">Sign in</button>
  </form>
</main>

<noscript><p class="noscript">Signing in needs JavaScript. Enable it and reload.</p></noscript>

<script src="/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Sign in — Los geht's</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23644a40'/%3E%3Cg fill='none' stroke='%23ffdfb5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 14h12v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z'/%3E%3Cpath d='M21 15h1a2.5 2.5 0 0 1 0 5h-1.2'/%3E%3Cpath d='M12.5 6.5c0 1.6 1.4 1.6 1.4 3.2M16.5 6.5c0 1.6 1.4 1.6 1.4 3.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main>
  <form id="form" class="card" novalidate>
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#644a40"/><g fill="none" stroke="#ffdfb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14h12v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M21 15h1a2.5 2.5 0 0 1 0 5h-1.2"/><path d="M12.5 6.5c0 1.6 1.4 1.6 1.4 3.2M16.5 6.5c0 1.6 1.4 1.6 1.4 3.2"/></g></svg><span>Los geht’s</span></div>
    <span class="eyebrow">Willkommen zurück</span>
    <h1>Welcome back</h1>
    <p class="lede">Enter your passphrase and pick up where you left off.</p>

    <!-- Lets password managers file the passphrase under a name. -->
    <input type="text" name="username" autocomplete="username" value="los-gehts" hidden>

    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" name="password" autocomplete="current-password" required autofocus>

    <p id="message" class="message" role="alert" aria-live="polite"></p>

    <button type="submit" id="submit">Sign in</button>
    <p class="foot">Progress syncs automatically after sign-in.</p>
  </form>
</main>

<noscript><p class="noscript">Signing in needs JavaScript. Enable it and reload.</p></noscript>

<script src="/login.js"></script>
</body>
</html>

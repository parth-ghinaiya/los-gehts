<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0c" media="(prefers-color-scheme: dark)">
<title>Sign in — Los geht's</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f2b90f'/%3E%3Cpath d='M12.5 9.5 20 16l-7.5 6.5' fill='none' stroke='%2317160f' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main>
  <form id="form" class="card" novalidate>
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#f2b90f"/><path d="M12.5 9.5 20 16l-7.5 6.5" fill="none" stroke="#17160f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Los geht’s</span></div>
    <h1>Welcome back</h1>
    <p class="lede">Enter your passphrase to continue learning.</p>

    <!-- Lets password managers file the passphrase under a name. -->
    <input type="text" name="username" autocomplete="username" value="los-gehts" hidden>

    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" name="password" autocomplete="current-password" required autofocus>

    <p id="message" class="message" role="alert" aria-live="polite"></p>

    <button type="submit" id="submit">Sign in</button>
    <p class="foot">Progress syncs automatically after sign-in.</p>
  </form>
</main>

<noscript><p class="noscript">Signing in needs JavaScript. Enable it and reload.</p></noscript>

<script src="/login.js"></script>
</body>
</html>
